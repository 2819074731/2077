server
{
 listen 80;
 server_name searx.hk0.cc;

 location ^~ /.well-known/acme-challenge/ {
 root /www/wwwroot/searx-acme;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

server
{
 listen 443 ssl;
 http2 on;
 server_name searx.hk0.cc;

 ssl_certificate /etc/letsencrypt/live/searx.hk0.cc/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/searx.hk0.cc/privkey.pem;

 access_log /www/wwwlogs/searx.hk0.cc.log;
 error_log /www/wwwlogs/searx.hk0.cc.error.log;
 add_header X-Robots-Tag noindex always;

 proxy_read_timeout 30s;
 proxy_http_version 1.1;
 proxy_set_header Host $host;

 location ^~ /.well-known/acme-challenge/ {
 root /www/wwwroot/searx-acme;
 }

 location = /healthz {
 access_log off;
 default_type text/plain;
 return 200 ok;
 }

 location / {
 if ($http_authorization != "Bearer 61b7afcbc7f375568976948392159e77ac08") {
 return 401;
 }
 proxy_pass http://127.0.0.1:8081;
 }
}
