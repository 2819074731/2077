server
{
    listen 80;
    server_name my2077.com;

    # 证书申请/续期校验目录
    include /www/server/panel/vhost/nginx/well-known/my2077.com.conf;
    location ~ \.well-known {
        allow all;
        root /www/wwwroot/my2077.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/my2077.com.log;
    error_log  /www/wwwlogs/my2077.com.error.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name my2077.com;

    ssl_certificate     /www/server/panel/vhost/cert/my2077.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/my2077.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 反代到本地 Nuxt（Nitro node-server）服务
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    access_log  /www/wwwlogs/my2077.com.log;
    error_log  /www/wwwlogs/my2077.com.error.log;
}
