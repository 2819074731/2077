server
{
    listen 80;
    server_name my2077.com;

    # 反代到本地 Nuxt（Nitro node-server）服务
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # 证书申请校验目录
    include /www/server/panel/vhost/nginx/well-known/my2077.com.conf;

    location ~ \.well-known {
        allow all;
        root /www/wwwroot/my2077.com;
    }

    access_log  /www/wwwlogs/my2077.com.log;
    error_log  /www/wwwlogs/my2077.com.error.log;
}
